<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>concept.shijia.work — redesigned diagonal frontpage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&family=Noto+Sans:ital,wght@0,400;0,600;0,800;1,400;1,600&display=swap" rel="stylesheet">

      <div class="project-statement" id="scanStatement"></div>
    </div>
    <button class="back" id="backBtn">↙ INDEX / ESC</button>
  </div>
</div>
<script src="data.js"></script>
<script src="wss/design.js"></script>
