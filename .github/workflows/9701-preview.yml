name: 9701 preview
on:
  push:
    branches: [feat/9701-live-atlas]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: 9701-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: concepts
      - uses: actions/checkout@v4
        with:
          repository: shhh-hoo/student-site
          ref: bb75ae2dd7d349b1472188e538010109374c3c48
          persist-credentials: false
          path: student
      - name: Package original sources and check scripts
        run: |
          mkdir -p preview
          cp -R concepts preview/concepts
          cp -R student preview/student
          rm -rf preview/concepts/.git preview/student/.git
          find concepts -maxdepth 1 -name '*.js' -exec node --check {} \;
          if [ -f concepts/scripts/build-9701-preview.mjs ]; then
            node concepts/scripts/build-9701-preview.mjs student preview/concepts
          fi
      - name: Install browser verifier
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Capture and test original product
        run: python concepts/scripts/inspect-9701.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 9701-preview
          path: |
            preview/
            evidence/
          retention-days: 7
          if-no-files-found: error
