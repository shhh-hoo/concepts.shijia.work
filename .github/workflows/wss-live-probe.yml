name: WSS2 live integration evidence
on:
  push:
    branches: [feat/wss-editorial-content]
    paths: ['.github/workflows/wss-live-probe.yml', 'wss/**', 'index.html']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser and media dependencies
        run: |
          pip install playwright==1.57.0 Pillow
          python -m playwright install --with-deps chromium
          command -v ffmpeg || { sudo apt-get update && sudo apt-get install -y ffmpeg; }
      - name: Serve the integrated page with labelled surrounding test media
        run: |
          python wss/tests/make_fixtures.py /tmp/wss-live-site
          python -m http.server 8765 --bind 127.0.0.1 --directory /tmp/wss-live-site > /tmp/wss-live-server.log 2>&1 &
          for attempt in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/ > /dev/null && break || sleep 1; done
          python wss/tests/showbook_checks.py --root /tmp/wss-live-site --base-url http://127.0.0.1:8765/ --live --output /tmp/wss-integrated-live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wss-integrated-real-app-evidence
          path: |
            /tmp/wss-integrated-live
            /tmp/wss-live-server.log
          retention-days: 14
